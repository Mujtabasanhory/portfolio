name: Update market data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-data.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forex and metals candles
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          symbols = ['EURUSD=X','GBPUSD=X','JPY=X','AUDUSD=X','CAD=X','CHF=X','NZDUSD=X','GC=F','SI=F']
          out = {'updated_at': int(time.time()*1000), 'symbols': {}}
          headers = {'User-Agent': 'Mozilla/5.0'}

          for symbol in symbols:
              url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(symbol, safe='') + '?interval=1m&range=5d&includePrePost=false'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  result = data['chart']['result'][0]
                  quote = result['indicators']['quote'][0]
                  rows = []
                  for i, ts in enumerate(result.get('timestamp', [])):
                      vals = [quote[k][i] for k in ('open','high','low','close')]
                      if all(v is not None for v in vals):
                          rows.append({'time': ts*1000, 'open': vals[0], 'high': vals[1], 'low': vals[2], 'close': vals[3]})
                  out['symbols'][symbol] = rows[-600:]
              except Exception as exc:
                  print(symbol, exc)
              time.sleep(0.5)

          path = Path('chart-vision-ai-v7/market-data.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chart-vision-ai-v7/market-data.json
          git diff --cached --quiet || git commit -m 'Update market data'
          git push
