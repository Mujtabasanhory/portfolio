<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061321"><title>Chart Vision AI V6</title><style>body{margin:0;background:#061321;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:24px;text-align:center}.spin{width:42px;height:42px;border:4px solid #244966;border-top-color:#2bc9ff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#9fb6ca;line-height:1.7}</style></head><body><div class="box"><div class="spin"></div><b>جارٍ تحميل محرك Vision V6…</b><br><small>تحليل سريع لآخر ثوانٍ من الفيديو مع قياس زمن التنفيذ.</small></div><script>(async()=>{try{let h=await fetch('../chart-vision-ai-v5/index.html?v=6').then(r=>r.text());h=h.replaceAll('Chart Vision AI V5','Chart Vision AI V6').replace('V5 — Motion Vision Engine','V6 — Fast Motion Engine').replace('تحليل صور وفيديو متعدد الإطارات مع قياس الزخم والاتجاه وسرعة السوق.','محرك سريع يحلل آخر ثوانٍ من الفيديو ويصدر القرار قبل فوات نقطة الدخول.').replace('ارفع فيديو للشارت من 6 إلى 20 ثانية','ارفع فيديو قصير للشارت من 3 إلى 8 ثوانٍ').replace('سيتم استخراج عدة إطارات وقياس تغير الاتجاه والزخم وسرعة الحركة.','الوضع السريع يحلل آخر 3 ثوانٍ فقط باستخدام 5 إطارات ذكية.').replace('تشغيل التحليل العميق','تشغيل التحليل السريع').replace('<div id="status" class="status"></div>','<div class="grid" style="margin-top:10px"><label><span>وضع تحليل الفيديو</span><select id="engineMode"><option value="fast" selected>⚡ سريع — 5 إطارات</option><option value="deep">🔬 متعمق — 9 إطارات</option></select></label><label><span>حد صلاحية الإشارة</span><select id="signalAge"><option value="6" selected>6 ثوانٍ</option><option value="10">10 ثوانٍ</option><option value="15">15 ثانية</option></select></label></div><div id="status" class="status"></div>');h=h.replace("if(video.duration<3||video.duration>60)$('#status').textContent='يفضل فيديو بين 6 و20 ثانية، وسيتم التحليل رغم ذلك.';else $('#status').textContent=`✓ فيديو ${video.duration.toFixed(1)} ثانية جاهز`;","if(video.duration<2||video.duration>20)$('#status').textContent='يفضل فيديو بين 3 و8 ثوانٍ للحصول على قرار سريع.';else $('#status').textContent=`✓ فيديو ${video.duration.toFixed(1)} ثانية جاهز للتحليل السريع`;");const fastFn=`async function extractVideo(){const deep=$('#engineMode')&&$('#engineMode').value==='deep',n=deep?9:5,windowSec=deep?Math.min(6,video.duration):Math.min(3,video.duration),start=Math.max(.05,video.duration-windowSec-.08),end=Math.max(start+.05,video.duration-.06),arr=[];canvas.style.display='block';video.style.display='none';const max=deep?700:480,s=Math.min(1,max/video.videoWidth);canvas.width=Math.max(1,Math.round(video.videoWidth*s));canvas.height=Math.max(1,Math.round(video.videoHeight*s));for(let i=0;i<n;i++){const t=start+(end-start)*i/(n-1);video.currentTime=t;await new Promise((res,rej)=>{const timer=setTimeout(res,700);video.onseeked=()=>{clearTimeout(timer);res()};video.onerror=rej});ctx.drawImage(video,0,0,canvas.width,canvas.height);arr.push(frameFeatures());$('#bar').style.width=((i+1)/n*88)+'%';await new Promise(r=>requestAnimationFrame(r))}return arr}`;h=h.replace(/async function extractVideo\(\)\{[\s\S]*?return arr\}/,fastFn);const analyzeFn=`$('#analyze').onclick=async()=>{const started=performance.now();try{$('#analyze').disabled=true;$('#progress').style.display='block';$('#bar').style.width='5%';$('#status').textContent=mode==='video'?'جارٍ تحليل آخر ثوانٍ من الحركة…':'جارٍ تحليل الصورة…';let frames;if(mode==='image'){drawImage(image);frames=[frameFeatures()]}else frames=await extractVideo();const elapsed=(performance.now()-started)/1000,r=analyzeFrames(frames),limit=+($('#signalAge')?$('#signalAge').value:6);r.elapsed=elapsed;if(mode==='video'&&elapsed>limit){r.decision='WAIT';r.confidence=Math.min(r.confidence,55);r.stale=true}render(r);$('#status').textContent=r.stale?`⚠️ استغرق التحليل ${elapsed.toFixed(1)}ث وتجاوز صلاحية الإشارة — أعد التسجيل`:`✓ اكتمل خلال ${elapsed.toFixed(1)} ثانية — يبدأ توقيت الصفقة من الآن`;$('#bar').style.width='100%';const s=$('#summary');if(s&&!r.stale)s.textContent+=` زمن التحليل ${elapsed.toFixed(1)} ثانية، وتبدأ مدة الصفقة من لحظة ظهور هذا القرار.`;if(r.stale){$('#entry').textContent='لا تدخل؛ الإشارة أصبحت قديمة. سجّل فيديو جديدًا أقصر.';$('#expiry').textContent='انتظر'}}catch(e){$('#status').textContent='تعذر التحليل. استخدم فيديو أقصر أو جودة أقل.'}finally{$('#analyze').disabled=false;setTimeout(()=>$('#progress').style.display='none',800)}};`;h=h.replace(/\$\('#analyze'\)\.onclick=async\(\)=>\{[\s\S]*?setTimeout\(\(\)=>\$\('#progress'\)\.style\.display='none',800\)\}\};/,analyzeFn);h=h.replace("if(r.speed>82&&r.trendStrength>72&&r.stability>78)sec=5;else if(r.speed>70&&r.stability>70)sec=15;","if(r.speed>82&&r.trendStrength>72&&r.stability>78)sec=15;else if(r.speed>70&&r.stability>70)sec=30;").replace("const entry=sec<=15?'الدخول فقط مع بداية شمعة جديدة وخلال أول ثانيتين، وتجنب الدخول بعد امتداد قوي.'","const entry=sec<=15?'الدخول فقط مع بداية شمعة جديدة وبعد ظهور القرار مباشرة، وتجنب الدخول بعد امتداد قوي.'").replace("const key='cvai_v5_history'","const key='cvai_v6_history'").replaceAll("localStorage.getItem('cvai_v5_history')","localStorage.getItem('cvai_v6_history')");document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box"><b>تعذر تحميل V6.</b><br><small>أعد فتح الرابط في Safari وتأكد من الاتصال.</small></div>'}})();</script></body></html>
