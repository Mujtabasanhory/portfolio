<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart Vision AI V4</title><style>body{margin:0;background:#061321;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:24px;text-align:center}.spin{width:42px;height:42px;border:4px solid #244966;border-top-color:#2bc9ff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#9fb6ca;line-height:1.7}</style></head><body><div class="box"><div class="spin"></div><b>جارٍ تحميل محرك Vision V4…</b><br><small>نسخة بنظام نقاط مرن ومدة صفقة ديناميكية.</small></div><script>(async()=>{try{let h=await fetch('../chart-vision-ai-elite/index.html?v=6').then(r=>r.text());h=h.replaceAll('Chart Vision AI Elite','Chart Vision AI Vision V4').replace('Elite V3 — Smart Expiry Engine','Vision V4.1 — Adaptive Entry & Expiry').replace('تحليل متعدد الطبقات مستوحى من منصات التحليل الاحترافية.','محرك رؤية مطوّر يحدد اتجاه الصفقة وتوقيت الدخول ومدتها من 5 ثوانٍ إلى 3 دقائق.').replaceAll('قوة الإعداد','درجة الإشارة').replace('لا تدخل عندما تكون النتيجة WAIT أو عندما تكون قوة الإعداد أقل من 72/100.','لا تدخل عندما تكون النتيجة WAIT أو عندما تكون درجة الإشارة أقل من 65/100.').replaceAll('G>100&&G>R*1.13&&G>B*.84','G>88&&G>R*1.08&&G>B*.78').replaceAll('R>110&&R>G*1.13&&R>B*.84','R>96&&R>G*1.08&&R>B*.78').replaceAll('cols[k]>=3','cols[k]>=2').replace('cs.length<9','cs.length<7').replaceAll('trendSlope<-.55&&shortSlope<-.35','trendSlope<-.35&&shortSlope<-.22').replaceAll('trendSlope>.55&&shortSlope>.35','trendSlope>.35&&shortSlope>.22').replaceAll('ind.maSlope<-.16','ind.maSlope<-.10').replaceAll('ind.maSlope>.16','ind.maSlope>.10').replaceAll('ind.rsiSlope<-.07','ind.rsiSlope<-.04').replaceAll('ind.rsiSlope>.07','ind.rsiSlope>.04');const fn=`function consensus(a,htf,confirm,vol){const core=[{w:25,...a.votes.trend},{w:25,...a.votes.sr},{w:20,...a.votes.mom},{w:15,...a.votes.pattern}],optional=[];if(!htf.r.includes('لم يُرفع'))optional.push({w:10,...htf});if(!confirm.r.includes('لم تُرفع'))optional.push({w:10,...confirm});optional.push({w:5,...vol});const all=[...core,...optional];let bs=0,ss=0,max=0,bn=0,sn=0;for(const x of all){max+=x.w;const k=Math.max(.45,Math.min(1,x.s/100));if(x.v==='BUY'){bs+=x.w*k;bn++}else if(x.v==='SELL'){ss+=x.w*k;sn++}}const b=bs/max*100,s=ss/max*100,m=Math.abs(b-s);let dec='WAIT',score=Math.max(b,s);if(b>=55&&m>=10&&bn>=2)dec='BUY';if(s>=55&&m>=10&&sn>=2)dec='SELL';if(dec==='WAIT'&&Math.max(b,s)>=48&&m>=14){dec=b>s?'BUY':'SELL';score=Math.max(b,s)-3}if(a.volatility>88&&score<75)dec='WAIT';score=Math.max(35,Math.min(92,Math.round(score)));return{dec,score,buy:bn,sell:sn,wait:all.length-bn-sn,total:all.length,buyScore:Math.round(b),sellScore:Math.round(s),margin:Math.round(m)}}`;const expiryFn=`function smartExpiry(a,confirm,tf,decision){if(decision==='WAIT')return{txt:'لا توجد مدة — انتظر',reason:'الإشارة غير كافية للدخول الآن.',entry:'لا تدخل الآن. التقط صورة جديدة بعد إغلاق الشمعة التالية.'};const aligned=confirm&&confirm.v===decision,strong=a.trendStrength>=74,medium=a.trendStrength>=52,fast=a.volatility>=72,extreme=a.volatility>=88,slow=a.volatility<=30;let sec=60,reason='',entry='';if(extreme){if(strong&&aligned){sec=5;reason='حركة شديدة السرعة مع تأكيد مباشر؛ دخول خاطف فقط.'}else{sec=30;reason='التذبذب مرتفع؛ مدة قصيرة لتقليل خطر الانعكاس.'}}else if(fast){if(strong&&aligned){sec=15;reason='زخم قوي وسريع ومتفق بين الصورتين.'}else if(strong){sec=30;reason='اتجاه قوي وسوق سريع.'}else{sec=60;reason='السوق سريع لكن الاتجاه متوسط؛ دقيقة أكثر توازنًا.'}}else if(slow){if(strong){sec=120;reason='الاتجاه واضح لكن الحركة بطيئة وتحتاج وقتًا.'}else{sec=180;reason='حركة بطيئة؛ تحتاج مدة أطول حتى يتطور الاتجاه.'}}else if(strong&&aligned){sec=30;reason='اتجاه قوي وتأكيد حركة؛ 30 ثانية مناسبة.'}else if(strong){sec=60;reason='اتجاه قوي بتذبذب طبيعي؛ دقيقة واحدة.'}else if(medium){sec=120;reason='اتجاه متوسط؛ دقيقتان تمنحان الحركة وقتًا كافيًا.'}else{sec=180;reason='الإشارة مقبولة لكن ضعيفة نسبيًا؛ ثلاث دقائق هي الحد الأنسب.'}if(tf>=180&&sec<30)sec=30;if(tf>=300&&sec<60)sec=60;const label=sec<60?sec+' ثوانٍ':sec===60?'دقيقة واحدة':sec===120?'دقيقتان':'3 دقائق';if(sec<=15)entry='ادخل فور بداية الشمعة الجديدة فقط، خلال أول 2–3 ثوانٍ، ولا تدخل بعد امتداد الحركة.';else if(sec===30)entry='ادخل خلال أول 5 ثوانٍ من الشمعة التالية بعد تأكيد اتجاه آخر شمعة.';else if(sec===60)entry='ادخل مع بداية الشمعة التالية بعد إغلاق مؤكد في اتجاه الإشارة.';else entry='انتظر إغلاق الشمعة الحالية، ثم ادخل مع بداية التالية بشرط بقاء السعر خارج مستوى الإلغاء.';return{txt:label,reason,entry}}`;h=h.replace(/function consensus\(a,htf,confirm,vol\)\{[\s\S]*?\nfunction smartExpiry/,fn+'\nfunction smartExpiry').replace(/function smartExpiry\(a,confirm,tf,decision\)\{[\s\S]*?\nfunction zone/,expiryFn+'\nfunction zone').replace('بعد اتفاق ${fin.buy} وحدات تحليل.','بعد تجميع نقاط شراء أعلى من البيع (${fin.buyScore} مقابل ${fin.sellScore}).').replace('بعد اتفاق ${fin.sell} وحدات تحليل.','بعد تجميع نقاط بيع أعلى من الشراء (${fin.sellScore} مقابل ${fin.buyScore}).').replace('الإشارات غير متفقة بما يكفي','فرق النقاط غير كافٍ أو الصورة غير حاسمة').replace('${Math.max(fin.buy,fin.sell)} تأكيدات من ${fin.total}','شراء ${fin.buyScore} / بيع ${fin.sellScore}').replace("q('#entry').textContent=fin.dec==='BUY'?'ادخل BUY مع بداية الشمعة التالية فقط بعد إغلاق شمعة خضراء فوق منطقة الدخول، ويفضل إعادة اختبار ناجحة للمستوى.':fin.dec==='SELL'?'ادخل SELL مع بداية الشمعة التالية فقط بعد إغلاق شمعة حمراء أسفل منطقة الدخول، ويفضل إعادة اختبار فاشلة للمستوى.':'لا تدخل الآن. أعد التصوير بعد إغلاق الشمعة التالية أو ارفع إطارًا أعلى.';","q('#entry').textContent=exp.entry+(fin.dec==='BUY'?' الاتجاه: BUY.':fin.dec==='SELL'?' الاتجاه: SELL.':'');").replace('هذا محرك تحليل بصري متقدم، لكنه لا يملك بثًا مباشرًا أو بيانات تاريخية داخلية لأصول Smarty وCamel Race. لذلك لا يساوي TrendSpider أو Tickeron من ناحية البيانات الحية والاختبار التاريخي، ولا يضمن الربح. استخدم WAIT كقرار أساسي عند التعارض.','محرك Vision V4.1 يحدد مدة الصفقة ديناميكيًا بين 5 ثوانٍ و3 دقائق حسب سرعة الحركة والتذبذب وقوة الاتجاه. مدة 5 و15 ثانية لا تُقترح إلا عند وجود حركة سريعة وتأكيد قوي. لا يملك بثًا مباشرًا ولا يضمن الربح.');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box"><b>تعذر تحميل النسخة.</b><br><small>أعد فتح الرابط في Safari.</small></div>'}})();</script></body></html>
