<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061321"><title>Chart Vision AI V7</title><style>html,body{margin:0;width:100%;height:100%;background:#061321}iframe{border:0;width:100%;height:100%;display:block}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#061321;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;z-index:9}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #244966;border-top-color:#2bc9ff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#9fb6ca;line-height:1.7}</style></head><body><div id="loading" class="loading"><div class="box"><div class="spin"></div><b>جارٍ تشغيل المراقبة المباشرة…</b><br><small>سيتم تحليل الزوج فور اختياره وتحديث الإشارة تلقائيًا.</small></div></div><iframe id="app" src="../chart-vision-ai-v6/index.html?v=10"></iframe><script>(()=>{'use strict';const frame=document.getElementById('app'),loading=document.getElementById('loading');frame.onload=()=>{try{const w=frame.contentWindow,d=frame.contentDocument,$=s=>d.querySelector(s);d.title='Chart Vision AI V7';const h=d.querySelector('h1');if(h)h.textContent='Chart Vision AI V7';const badge=d.querySelector('.badge');if(badge)badge.textContent='V7 — Live Market Monitor';const box=d.querySelector('#marketPanel .marketbox');if(box){box.innerHTML='<b>مراقبة وتحليل مباشر للأسواق</b><small>اختر الزوج أو الأصل وسيبدأ التحليل تلقائيًا. عند تفعيل المراقبة تتحدث الإشارة كل دقيقة ما دامت الصفحة مفتوحة.</small>'}const status=$('#marketStatus'),symbol=$('#marketSymbol'),interval=$('#marketInterval'),key=$('#apiKey'),analyze=$('#analyzeMarket');if(!symbol||!interval||!key||!analyze)throw new Error('تعذر العثور على قسم الأسواق');const controls=d.createElement('div');controls.className='grid';controls.style.marginTop='10px';controls.innerHTML='<label><span>المراقبة التلقائية</span><select id="autoMonitor"><option value="on" selected>🟢 مفعلة — كل 60 ثانية</option><option value="off">⚪ متوقفة</option></select></label><label><span>التحديث القادم</span><div id="countdown" style="border:1px solid #2b526f;border-radius:13px;background:#071a2b;color:#8fe1ff;padding:12px;font-weight:900">—</div></label>';const keyLabel=key.closest('label');keyLabel.parentNode.insertBefore(controls,keyLabel.nextSibling);analyze.textContent='تحديث الإشارة الآن';let timer=null,tick=null,nextAt=0,lastDecision='';function canRun(){return key.value.trim()&&!analyze.disabled&&d.querySelector('#marketPanel').style.display!=='none'}function run(reason='auto'){if(!canRun()){if(status&&!key.value.trim())status.textContent='أدخل مفتاح Twelve Data مرة واحدة لبدء التحليل التلقائي.';return}analyze.click();nextAt=Date.now()+60000;if(status&&reason==='select')status.textContent='جارٍ تحليل الزوج المختار مباشرة…'}function stop(){if(timer)clearInterval(timer);if(tick)clearInterval(tick);timer=tick=null}function start(){stop();if($('#autoMonitor').value!=='on'){$('#countdown').textContent='متوقفة';return}nextAt=Date.now()+60000;timer=setInterval(()=>{if(document.visibilityState==='visible'&&canRun())run('auto')},60000);tick=setInterval(()=>{const sec=Math.max(0,Math.ceil((nextAt-Date.now())/1000));$('#countdown').textContent=canRun()?sec+' ثانية':'بانتظار المفتاح';const dec=$('#decision')?.textContent||'';if(dec&&dec!=='WAIT'&&dec!==lastDecision){lastDecision=dec;try{w.navigator.vibrate&&w.navigator.vibrate([120,60,120])}catch(e){}}},1000)}symbol.addEventListener('change',()=>{run('select');start()});interval.addEventListener('change',()=>{run('select');start()});key.addEventListener('change',()=>{if(key.value.trim()){run('select');start()}});$('#autoMonitor').addEventListener('change',()=>{$('#autoMonitor').value==='on'?(run('select'),start()):stop()});const oldMarkets=$('#tabMarkets').onclick;$('#tabMarkets').onclick=e=>{oldMarkets&&oldMarkets.call($('#tabMarkets'),e);setTimeout(()=>{if(key.value.trim())run('select');start()},100)};d.addEventListener('visibilitychange',()=>{if(d.visibilityState==='visible'&&$('#autoMonitor').value==='on'){run('auto');start()}});start();setTimeout(()=>{loading.style.display='none'},200)}catch(e){console.error(e);loading.innerHTML='<div class="box"><b>تعذر تشغيل المراقبة المباشرة.</b><br><small>أعد فتح الصفحة في Safari.</small></div>'}}})();</script></body></html>
