te.classList.contains('source-note'))note.textContent='مصدر البيانات يُختار تلقائيًا، ولا يلزم إدخال أي مفتاح.'}analyze.textContent='تحديث الإشارة الآن';const controls=d.createElement('div');controls.className='grid';controls.style.marginTop='10px';controls.innerHTML='<label><span>المراقبة التلقائية</span><select id="autoMonitor"><option value="on" selected>🟢 مفعلة — كل 60 ثانية</option><option value="off">⚪ متوقفة</option></select></label><label><span>التحديث القادم</span><div id="countdown" style="border:1px solid #2b526f;border-radius:13px;background:#071a2b;color:#8fe1ff;padding:12px;font-weight:900">—</div></label>';analyze.parentNode.insertBefore(controls,analyze);function ema(v,p){const k=2/(p+1);let e=v[0];return v.map((x,i)=>i?(e=x*k+e*(1-k)):e)}function rsi(v,p=14){let g=0,l=0;for(let i=v.length-p;i<v.length;i++){const x=v[i]-v[i-1];if(x>0)g+=x;else l-=x}const rs=(g/p)/Math.max(1e-12,l/p);return 100-100/(1+rs)}function std(v){const m=v.reduce((a,b)=>a+b,0)/v.length;return Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/v.length)}function atr(rows,p=14){const tr=[];for(let i=1;i<rows.length;i++){const h=rows[i].high,l=rows[i].low,pc=rows[i-1].close;tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}return tr.slice(-p).reduce((a,b)=>a+b,0)/Math.max(1,Math.min(p,tr.length))}const intMap={'1min':'1m','5min':'5m','15min':'15m','30min':'30m','1h':'1h'},yInt={'1min':'1m','5min':'5m','15min':'15m','30min':'30m','1h':'60m'},binance={"BTC/USD":"BTCUSDT","ETH/USD":"ETHUSDT","SOL/USD":"SOLUSDT"},yahoo={"EUR/USD":"EURUSD=X","GBP/USD":"GBPUSD=X","USD/JPY":"JPY=X","AUD/USD":"AUDUSD=X","USD/CAD":"CAD=X","USD/CHF":"CHF=X","NZD/USD":"NZDUSD=X","XAU/USD":"GC=F","XAG/USD":"SI=F"};async function fetchJson(url){const tries=[url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?url='+encodeURIComponent(url)];let err;for(const u of tries){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){err=e}}throw err||new Error('تعذر الاتصال بمصدر البيانات')}async function getRows(sym,intv){if(binance[sym]){const u=`https://api.binance.com/api/v3/klines?symbol=${binance[sym]}&interval=${intMap[intv]}&limit=120`;const j=await fetchJson(u);return j.map(x=>({open:+x[1],high:+x[2],low:+x[3],close:+x[4]}))}const ys=yahoo[sym];if(!ys)throw new Error('هذا الأصل غير مدعوم حاليًا');const range=intv==='1h'?'1mo':'5d',u=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ys)}?interval=${yInt[intv]}&range=${range}`;const j=await fetchJson(u),r=j.chart?.result?.[0],q=r?.indicators?.quote?.[0];if(!q)throw new Error('لم تصل بيانات كافية');return q.close.map((c,i)=>({open:+q.open[i],high:+q.high[i],low:+q.low[i],close:+c})).filter(x=>[x.open,x.high,x.low,x.close].every(Number.isFinite)).slice(-120)}function smartExpiry(r){if(r.decision==='WAIT')return['انتظر','المؤشرات غير متفقة بما يكفي.','لا تدخل حتى تظهر إشارة أوضح.'];const base={'1min':60,'5min':300,'15min':900,'30min':1800,'1h':3600}[r.interval]||300;let mult=2;if(r.trendStrength>=75&&r.stability>=75&&r.speed>=70)mult=1;else if(r.trendStrength>=70&&r.stability>=75)mult=1.5;else if(r.speed<=35)mult=3;else if(r.volatilityScore>=75)mult=1;let sec=Math.round(base*mult),allowed=[60,120,180,300,600,900,1800,2700,3600,7200,10800];sec=allowed.reduce((a,b)=>Math.abs(b-sec)<Math.abs(a-sec)?b:a);return[sec<3600?(sec/60)+' دقيقة':(sec/3600)+' ساعة',`اختيرت المدة من الرسم: قوة الاتجاه ${r.trendStrength}/100، سرعة الحركة ${r.speed}/100، الثبات ${r.stability}%، والتذبذب ${r.volatilityScore}/100.`,r.speed>=70?'الدخول بعد إغلاق شمعة التأكيد مباشرة، بشرط ألا يكون السعر ابتعد عن نقطة الإشارة.':'انتظر إغلاق شمعة تأكيد ثم ادخل مع بداية الشمعة التالية.']}function word(v){return v==='BUY'?'شراء':v==='SELL'?'بيع':'انتظار'}function render(r){const ex=smartExpiry(r);$('#result').style.display='block';$('#decision').textContent=r.decision;$('#decision').className='decision '+r.decision;$('#confidence').textContent=r.confidence+'/100';$('#summary').textContent=r.decision==='WAIT'?`${r.symbol}: لا توجد صفقة واضحة الآن.`:`${r.symbol}: الإشارة الحالية ${word(r.decision)} عند سعر ${r.price}.`;$('#trendTitle').textContent='الاتجاه EMA';$('#momentumTitle').textContent='الزخم RSI';$('#patternTitle').textContent='MACD';$('#motionTitle').textContent='حركة السعر';$('#trendVote').textContent=word(r.trendVote);$('#trendVote').className=r.trendVote;$('#trendReason').textContent=`EMA20 ${r.ema20} مقابل EMA50 ${r.ema50}.`;$('#momentumVote').textContent=word(r.rsiVote);$('#momentumVote').className=r.rsiVote;$('#momentumReason').textContent=`RSI = ${r.rsi}.`;$('#patternVote').textContent=word(r.macdVote);$('#patternVote').className=r.macdVote;$('#patternReason').textContent=`MACD ${r.macd} / Signal ${r.signal}.`;$('#motionVote').textContent=word(r.priceVote);$('#motionVote').className=r.priceVote;$('#motionReason').textContent=`تغير آخر 10 شموع ${r.change}%.`;$('#expiry').textContent=ex[0];$('#expiryReason').textContent=ex[1];$('#entry').textContent=ex[2];$('#metric1Label').textContent='قوة الاتجاه';$('#metric2Label').textContent='سرعة الحركة';$('#metric3Label').textContent='ثبات الإشارة';$('#metric4Label').textContent='التذبذب';$('#trendStrength').textContent=r.trendStrength+'/100';$('#speed').textContent=r.speed+'/100';$('#stability').textContent=r.stability+'%';$('#quality').textContent=r.volatilityScore+'/100';$('#frames').textContent=r.interval;$('#buyScore').textContent='شراء '+r.buy;$('#sellScore').textContent='بيع '+r.sell;$('#result').scrollIntoView({behavior:'smooth'})}let busy=false,lastDecision='';async function run(reason='manual'){if(busy)return;busy=true;analyze.disabled=true;status.textContent=reason==='select'?'جارٍ تحليل الزوج المختار مباشرة…':'جارٍ تحديث بيانات السوق…';try{const sym=symbol.value,intv=interval.value,rows=await getRows(sym,intv),cl=rows.map(x=>x.close);if(cl.length<60)throw new Error('البيانات غير كافية');const e20=ema(cl,20),e50=ema(cl,50),e12=ema(cl,12),e26=ema(cl,26),m=e12.map((x,i)=>x-e26[i]),sg=ema(m,9),i=cl.length-1,price=cl[i],rv=rsi(cl),macd=m[i],signal=sg[i],change=(price/cl[Math.max(0,i-10)]-1)*100,vol=std(cl.slice(-20))/price*100,atrPct=atr(rows)/price*100;let buy=0,sell=0;const trendVote=e20[i]>e50[i]?'BUY':e20[i]<e50[i]?'SELL':'WAIT';trendVote==='BUY'?buy+=30:trendVote==='SELL'&&(sell+=30);const rsiVote=rv>55&&rv<72?'BUY':rv<45&&rv>28?'SELL':'WAIT';rsiVote==='BUY'?buy+=20:rsiVote==='SELL'&&(sell+=20);const macdVote=macd>signal?'BUY':macd<signal?'SELL':'WAIT';macdVote==='BUY'?buy+=25:macdVote==='SELL'&&(sell+=25);const priceVote=change>.08?'BUY':change<-.08?'SELL':'WAIT';priceVote==='BUY'?buy+=25:priceVote==='SELL'&&(sell+=25);let decision='WAIT';if(buy>=60&&buy-sell>=25)decision='BUY';if(sell>=60&&sell-buy>=25)decision='SELL';if(rv>78||rv<22)decision='WAIT';const gap=Math.abs(e20[i]-e50[i])/price*100,trendStrength=Math.min(100,Math.round(gap*1800+Math.abs(change)*20+Math.abs(buy-sell)*.35)),speed=Math.min(100,Math.round(atrPct*1200+Math.abs(change)*18)),votes=[trendVote,rsiVote,macdVote,priceVote],winner=decision==='WAIT'?Math.max(votes.filter(x=>x==='BUY').length,votes.filter(x=>x==='SELL').length):votes.filter(x=>x===decision).length,stability=Math.round(winner/4*100),volatilityScore=Math.min(100,Math.round(vol*1300+atrPct*700)),confidence=Math.min(92,Math.max(40,Math.round(Math.max(buy,sell)*.72+Math.abs(buy-sell)*.12+trendStrength*.10+stability*.06)));render({symbol:sym,interval:intv,decision,confidence,buy,sell,trendVote,rsiVote,macdVote,priceVote,price:price.toFixed(sym.includes('JPY')?3:sym.includes('BTC')?2:5),ema20:e20[i].toFixed(5),ema50:e50[i].toFixed(5),rsi:rv.toFixed(1),macd:macd.toFixed(5),signal:signal.toFixed(5),change:change.toFixed(2),trendStrength,speed,stability,volatilityScore});status.textContent='✓ تم تحديث الإشارة بدون مفتاح API.';if(decision!=='WAIT'&&decision!==lastDecision){lastDecision=decision;try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}}catch(e){console.error(e);sta
